  method: POST
  headers:
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "reason": "Test void"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "statusCode": 403,
        "statusMessage": "Cannot void a document that is already Voided."
      }
order: 3000
