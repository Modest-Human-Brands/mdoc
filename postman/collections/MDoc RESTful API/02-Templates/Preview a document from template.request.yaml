$kind: http-request
description: Compiles template variables and renders a Base64 PDF with its pageCount. Strict mode - invalid fields return 400 with data.errors[{field,message,code}]. Missing fields are filled from template placeholders. Use ?draft=true for live typing (see "Live preview (draft)").
url: '{{base_url}}/api/document/template/preview'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "templateId": "internship-completion-certificate",
      "variables": {
        "recipient": {
          "name": "Alex Mercer",
          "role": "Marketing Intern",
          "address": "123 Main St",
          "email": "alex@example.com",
          "phone": "+1 555-0100"
        },
        "scopeOfWork": "Brand Strategy",
        "startDate": "2025-06-01T00:00:00.000Z",
        "endDate": "2025-12-31T00:00:00.000Z"
      }
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const Ajv = require("ajv");
      const ajv = new Ajv();
      const inputSchema = {
        type: "object",
        required: ["templateId", "variables"],
        properties: {
          templateId: { type: "string" },
          variables: { type: "object" }
        }
      };
      const valid = ajv.validate(inputSchema, JSON.parse(pm.request.body.raw));
      pm.test("Request body valid against Input Schema", () => pm.expect(valid).to.be.true);
  - type: afterResponse
    language: text/javascript
    code: |-
      if (pm.response.code === 200) {
        const outputSchema = {
          type: "object",
          required: ["pdfBase64", "pageCount"],
          properties: {
            pdfBase64: { type: "string" },
            pageCount: { type: "number", minimum: 1 }
          }
        };
        pm.test("Output matches Preview Schema", () => pm.response.to.have.jsonSchema(outputSchema));
      }
examples: .resources/Preview a document from template.resources/examples
order: 4000
