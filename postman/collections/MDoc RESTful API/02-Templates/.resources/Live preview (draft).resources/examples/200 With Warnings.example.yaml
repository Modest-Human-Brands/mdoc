$kind: http-example
request:
  url: '{{base_url}}/api/document/template/preview?draft=true'
  method: POST
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "templateId": "invoice",
        "variables": { "recipient": { "name": "Chai Theory Pvt Ltd", "address": "Bandra West, Mumbai", "email": "acc", "phone": "+91 98200 12345" } }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    content-type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "pdfBase64": "JVBERi0xLjQKJcOkw7zDtsOf...",
        "pageCount": 2,
        "warnings": [
          { "field": "recipient.email", "message": "Invalid recipient email", "code": "invalid_format" }
        ]
      }
order: 1000
