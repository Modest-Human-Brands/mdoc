$kind: http-example
request:
  url: '{{base_url}}/api/document/template'
  method: GET
response:
  statusCode: 200
  statusText: OK
  headers:
    content-type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      [
        {
          "id": "invoice",
          "label": "Billing Invoice",
          "shortLabel": "Invoice",
          "category": "Billing",
          "description": "The official document outlining the charges, payment terms, and amount due.",
          "sampleUrl": "/api/document/template/invoice/sample.pdf"
        },
        {
          "id": "internship-completion-certificate",
          "label": "Internship Completion Certificate",
          "shortLabel": "Internship certificate",
          "category": "Certificates",
          "description": "The formal proof of completion, including your start and end dates, role, and an authorized signature.",
          "sampleUrl": "/api/document/template/internship-completion-certificate/sample.pdf"
        }
      ]
order: 1000
