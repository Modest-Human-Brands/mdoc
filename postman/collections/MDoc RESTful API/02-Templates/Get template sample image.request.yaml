$kind: http-request
description: Static sample image of one template page (PNG, 2x, neutral organisation, {{Field Label}} tokens), served from public/templates (Git LFS) via the API so it passes through proxies. Use the pages[].url values from the template list; the ?v=<hash> suffix makes the response immutable-cacheable. 404 until the templates:sample-images task has been run.
url: '{{base_url}}/api/document/template/:id/sample/:page.png'
method: GET
pathVariables:
  id: invoice
  page: '1'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      if (pm.response.code === 200) {
        pm.test("Content-Type is image/png", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("image/png"));
      } else {
        pm.test("Status is 404", () => pm.response.to.have.status(404));
      }
examples: .resources/Get template sample image.resources/examples
order: 3600
