$kind: http-request
description: Renders the template as an inline PDF (cached for 1 hour). variant=sample (default) is the neutral organisation with {{Field Label}} tokens; variant=branded uses the default organisation. For the picker prefer the static images (see "Get template sample image").
url: '{{base_url}}/api/document/template/:id/sample.pdf?variant=sample'
method: GET
queryParams:
  - key: variant
    value: sample
pathVariables:
  id: invoice
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      if (pm.response.code === 200) {
        pm.test("Content-Type is application/pdf", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("application/pdf"));
        pm.test("Body is a PDF", () => pm.expect(pm.response.text().startsWith("%PDF")).to.be.true);
      } else {
        pm.test("Status is 404", () => pm.response.to.have.status(404));
      }
examples: .resources/Get template sample PDF.resources/examples
order: 3500
