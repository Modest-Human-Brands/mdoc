$kind: http-request
description: Fetch template cards for the picker. thumbnailUrl / pages are the static sample images (neutral organisation, {{Field Label}} tokens) generated by the templates:sample-images task; they are null / empty until that task has run. `category` is Billing, Contracts or Certificates; `sampleUrl` is a sample PDF (placeholder data) for the preview pane.
url: '{{base_url}}/api/document/template'
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const outputSchema = {
        type: "array",
        items: {
          type: "object",
          required: ["id", "label", "shortLabel", "category", "description", "sampleUrl", "pageCount", "pages"],
          properties: {
            id: { type: "string" },
            label: { type: "string" },
            shortLabel: { type: "string" },
            category: { type: ["string", "null"], enum: ["Billing", "Contracts", "Certificates", null] },
            description: { type: "string" },
            sampleUrl: { type: "string" },
            thumbnailUrl: { type: ["string", "null"] },
            pageCount: { type: "number" },
            version: { type: ["string", "null"] },
            pages: {
              type: "array",
              items: { type: "object", required: ["url", "width", "height"], properties: { url: { type: "string" }, width: { type: "number" }, height: { type: "number" } } }
            }
          }
        }
      };

      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      pm.test("Matches Template List schema", () => {
        pm.response.to.have.jsonSchema(outputSchema);
      });
examples: .resources/Get all templates.resources/examples
order: 2000
