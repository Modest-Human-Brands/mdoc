$kind: http-request
description: Fetch template cards for the picker. `category` is Billing, Contracts or Certificates; `sampleUrl` is a sample PDF (placeholder data) for the preview pane.
url: '{{base_url}}/api/document/template'
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const outputSchema = {
        type: "array",
        items: {
          type: "object",
          required: ["id", "label", "shortLabel", "category", "description", "sampleUrl"],
          properties: {
            id: { type: "string" },
            label: { type: "string" },
            shortLabel: { type: "string" },
            category: { type: ["string", "null"], enum: ["Billing", "Contracts", "Certificates", null] },
            description: { type: "string" },
            sampleUrl: { type: "string" }
          }
        }
      };

      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      pm.test("Matches Template List schema", () => {
        pm.response.to.have.jsonSchema(outputSchema);
      });
examples: .resources/Get all templates.resources/examples
order: 2000
