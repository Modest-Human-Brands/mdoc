$kind: http-request
description: Verification ping to check system readiness and active node.
url: '{{base_url}}/api/health'
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const outputSchema = {
        type: "object",
        required: ["status", "node"],
        properties: {
          status: { type: "string", enum: ["OK"] },
          version: { type: ["string", "null"] },
          buildTime: { type: ["string", "null"] },
          node: { type: "string" }
        }
      };

      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      pm.test("Response body matches Health schema", () => {
        pm.response.to.have.jsonSchema(outputSchema);
      });
examples: .resources/Check health.resources/examples
order: 1000
