$kind: http-request
description: Download or view raw PDF or rendered PNG thumbnail.
url: '{{base_url}}/api/document/:id/content'
method: GET
queryParams:
  - key: download
    value: 'true'
    disabled: true
  - key: type
    value: 'image'
    disabled: true
pathVariables:
  id: '{{document_id}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Response is successful or 404", () => pm.expect([200, 404]).to.include(pm.response.code));
      if (pm.response.code === 200) {
        pm.test("Headers contain Content-Type", () => pm.expect(pm.response.headers.has("Content-Type")).to.be.true);
      }
examples: .resources/Get document content.resources/examples
order: 8000
